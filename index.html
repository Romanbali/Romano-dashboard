<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f7fb;
      --surface: #ffffff;
      --stroke: #d9dce5;
      --radius: clamp(12px, 2vw, 20px);
      --space: clamp(7px, 1.45vw, 16px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: clamp(8px, 1.35vw, 15px);
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--page);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .dashboard {
      display: grid;
      grid-template-columns: clamp(30px, 4.55vw, 50px) minmax(0, 1fr);
      gap: clamp(10px, 1.65vw, 18px);
      width: 100%;
      min-width: 0;
    }

    .rail,
    .top-panel,
    .tile {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: 0 2px 5px rgba(28, 36, 58, 0.055);
    }

    .rail { min-height: clamp(590px, 86vh, 900px); }

    .workspace {
      display: grid;
      grid-template-rows: clamp(42px, 6.2vw, 68px) auto;
      gap: clamp(10px, 1.65vw, 18px);
      min-width: 0;
    }

    .top-panel { min-width: 0; }

    .grid {
      display: grid;
      grid-template-rows: repeat(3, clamp(110px, 26vw, 180px));
      gap: var(--space);
      min-width: 0;
    }

    .tile-row {
      display: grid;
      grid-template-columns: repeat(var(--count), minmax(0, 1fr));
      gap: var(--space);
      min-width: 0;
    }

    .tile {
      min-width: 0;
      min-height: 0;
    }
  </style>
</head>
<body>
  <main class="dashboard" aria-label="Dashboard layout">
    <aside class="rail" aria-hidden="true"></aside>
    <section class="workspace" aria-label="Dashboard workspace">
      <header class="top-panel" aria-hidden="true"></header>
      <div class="grid" id="tile-grid" aria-hidden="true">
        <div class="tile-row"></div>
        <div class="tile-row"></div>
        <div class="tile-row"></div>
      </div>
    </section>
  </main>
  <script>
    const rows = document.querySelectorAll(".tile-row");
    let counts = rows.length ? Array.from(rows, () => 2 + Math.floor(Math.random() * 3)) : [];
    if (counts.length > 1 && counts.every(count => count === counts[0])) {
      counts[counts.length - 1] = counts[counts.length - 1] === 4 ? 3 : counts[counts.length - 1] + 1;
    }

    rows.forEach((row, index) => {
      row.style.setProperty("--count", counts[index]);
      for (let i = 0; i < counts[index]; i += 1) {
        row.appendChild(document.createElement("div")).className = "tile";
      }
    });
  </script>
</body>
</html>
