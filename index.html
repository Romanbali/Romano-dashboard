<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f7fb;
      --surface: #ffffff;
      --stroke: #d9dce5;
      --radius: 20px;
      --space: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 15px 14px;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--page);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr);
      gap: 18px;
      width: 100%;
      min-width: 1100px;
      height: calc(100vh - 30px);
      min-height: 0;
    }

    .rail,
    .top-panel,
    .tile {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: 0 2px 5px rgba(28, 36, 58, 0.055);
    }

    .rail { min-height: 0; }

    .workspace {
      display: grid;
      grid-template-rows: 68px minmax(0, 1fr);
      gap: 18px;
      min-width: 0;
      min-height: 0;
    }

    .top-panel { min-width: 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: var(--space);
      min-width: 0;
      min-height: 0;
    }

    .tile {
      min-width: 0;
      min-height: 0;
    }
  </style>
</head>
<body>
  <main class="dashboard" aria-label="Dashboard layout">
    <aside class="rail" aria-hidden="true"></aside>
    <section class="workspace" aria-label="Dashboard workspace">
      <header class="top-panel" aria-hidden="true"></header>
      <div class="grid" aria-hidden="true">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>
    </section>
  </main>
</body>
</html>
