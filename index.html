<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Romano Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f7fb;
      --surface: #ffffff;
      --stroke: #d9dce5;
      --radius: clamp(12px, 2vw, 20px);
      --space: clamp(7px, 1.45vw, 16px);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      padding: clamp(8px, 1.35vw, 15px);
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--page);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body.sheet-open { overflow: hidden; }

    .dashboard {
      display: grid;
      grid-template-columns: clamp(30px, 4.55vw, 50px) minmax(0, 1fr);
      gap: clamp(10px, 1.65vw, 18px);
      width: 100%;
      min-width: 0;
    }
    .rail { position:relative; display:flex; flex-direction:column; align-items:center; gap:clamp(18px,3vh,28px); padding:12px 5px; min-height:clamp(590px,86vh,900px); background:#fff; border:1px solid #e6e9f0; border-radius:18px; box-shadow:0 5px 22px rgba(27,39,65,.045); }
    .brand-mark { display:grid; place-items:center; width:31px; height:31px; border-radius:11px; background:#142033; color:#fff; font-size:17px; font-weight:850; letter-spacing:-.06em; }
    .rail-nav { display:grid; gap:10px; }
    .nav-icon { display:grid; place-items:center; width:34px; height:34px; border:0; border-radius:11px; background:transparent; color:#929bad; font:600 19px ui-sans-serif,system-ui; cursor:pointer; }
    .nav-icon.active { color:#159447; background:#eaf8ee; }
    .rail-bottom { margin-top:auto; }
    .profile-dot,.header-avatar { display:grid; place-items:center; border-radius:50%; color:#fff; background:#26354d; font-size:11px; font-weight:800; }
    .profile-dot { width:28px; height:28px; }
    .workspace { gap:clamp(12px,1.8vw,20px); }
    .top-panel { display:flex; align-items:center; justify-content:space-between; min-width:0; padding:7px clamp(12px,2vw,22px); background:transparent; border:0; box-shadow:none; }
    .header-copy { display:grid; gap:1px; }
    .eyebrow { color:#929bad; font-size:9px; font-weight:800; letter-spacing:.16em; }
    .header-copy h1 { margin:0; color:#182235; font-size:clamp(18px,2.1vw,25px); font-weight:800; letter-spacing:-.045em; }
    .header-actions { display:flex; align-items:center; gap:12px; }
    .live-status { display:flex; align-items:center; gap:7px; color:#748094; font-size:11px; font-weight:600; }
    .live-status i { width:7px; height:7px; border-radius:50%; background:#28b765; box-shadow:0 0 0 3px #e6f7ec; }
    .header-avatar { width:31px; height:31px; }
    .rail, .top-panel, .tile {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: 0 2px 5px rgba(28, 36, 58, 0.055);
    }
    .rail { min-height: clamp(590px, 86vh, 900px); }
    .workspace {
      display: grid;
      grid-template-rows: clamp(42px, 6.2vw, 68px) auto;
      gap: clamp(10px, 1.65vw, 18px);
      min-width: 0;
    }
    .top-panel { min-width: 0; }
    .goal-overview { display:grid; grid-template-columns:minmax(0, 1fr) minmax(125px, 190px); align-items:stretch; gap:12px; margin-bottom:18px; }
    .goal-card { min-width:0; padding:14px clamp(12px,2.2vw,22px) 11px; border:1px solid #e0e5ee; border-radius:17px; background:linear-gradient(120deg,#fff 0%,#fbfcff 100%); box-shadow:0 2px 7px rgba(28,36,58,.045); }
    .goal-topline { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .goal-values { display:flex; align-items:baseline; gap:8px; min-width:0; white-space:nowrap; font-size:clamp(17px,3.2vw,30px); font-weight:800; letter-spacing:-.045em; color:#626b7d; font-variant-numeric:tabular-nums; }
    .goal-values #goal-current { color:#159447; font-size:1.28em; }
    .goal-meta { display:flex; align-items:center; gap:12px; white-space:nowrap; }
    .goal-forecast { padding:6px 10px; border:1px solid #a6e4b7; border-radius:999px; color:#626b7d; background:#f5fff7; font-size:clamp(10px,1.8vw,14px); box-shadow:0 2px 5px rgba(21,148,71,.08); }
    .goal-forecast strong { color:#159447; }
    .goal-percent { color:#151b2c; font-size:clamp(20px,3.3vw,31px); letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
    .goal-track-wrap { padding:20px 0 4px; }
    .goal-track { position:relative; height:clamp(15px,3.2vw,24px); border-radius:999px; background:#e5e8ee; }
    .goal-fill { position:absolute; inset:0 auto 0 0; width:100%; border-radius:inherit; background:linear-gradient(90deg,#39ed72,#13b94c); transform:scaleX(.426); transform-origin:left center; transition:transform 180ms var(--ease-out); }
    .goal-forecast-marker { position:absolute; z-index:1; left:98.6%; top:-9px; bottom:-5px; border-left:2px dashed #159447; pointer-events:none; }
    .goal-forecast-pin { position:absolute; z-index:2; right:0; bottom:calc(100% + 15px); padding:5px 9px; border:1px solid #a6e4b7; border-radius:10px; background:#f5fff7; color:#626b7d; font-size:11px; white-space:nowrap; transform:translateX(0); pointer-events:none; }
    .goal-forecast-pin strong { color:#159447; }
    .goal-range { position:absolute; z-index:3; inset:-10px 0; width:100%; height:calc(100% + 20px); margin:0; opacity:0; cursor:ew-resize; touch-action:pan-y; }
    .goal-hint { margin-top:9px; color:#8a91a0; font-size:10px; }
    .deposit-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 18px;
      padding: 14px 18px;
      min-height: 68px;
      color: #596579;
      background: linear-gradient(105deg, #f0f8f2 0%, #f7faf8 100%);
      border: 1px solid #dcecdf;
      border-radius: 15px;
      box-shadow: 0 2px 7px rgba(31, 91, 48, .045);
    }
    .deposit-summary span {
      font-size: 12px;
      letter-spacing: .12em;
      font-weight: 800;
      line-height: 1.2;
    }
    .deposit-summary strong {
      color: #159447;
      font-size: clamp(23px, 3.5vw, 30px);
      letter-spacing: -.035em;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .grid {
      display: grid;
      grid-template-rows: repeat(4, clamp(110px, 26vw, 180px));
      gap: var(--space);
      min-width: 0;
    }
    .tile-row { display: grid; gap: var(--space); min-width: 0; }
    .row-one { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .row-two { grid-template-columns: 2fr 1fr; }
    .row-three { grid-template-columns: 1fr 1fr 2fr; }
    .row-four { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .module-tile { display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:5px; padding:clamp(10px,1.4vw,17px); text-align:left; background:linear-gradient(145deg,#fff 0%,#fbfcfe 100%); }
    .module-top { display:flex; width:100%; align-items:center; justify-content:space-between; }
    .module-icon { display:grid; place-items:center; width:27px; height:27px; border-radius:9px; background:#f0f4f8; color:#53647d; font-size:15px; font-weight:800; }
    .module-arrow { color:#aab2c0; font-size:15px; }
    .module-title { color:#202b3e; font-size:clamp(11px,1.25vw,15px); font-weight:800; letter-spacing:-.025em; }
    .module-subtitle { color:#8992a2; font-size:clamp(8px,.85vw,10px); }
    .module-empty { margin-top:auto; color:#b1b8c4; font-size:9px; }
    .module-tile:nth-child(2) .module-icon,.module-tile:nth-child(4) .module-icon { color:#159447; background:#eaf8ee; }
    .module-tile:nth-child(3) .module-icon,.module-tile:nth-child(8) .module-icon { color:#bd7b36; background:#fff5e9; }
    .module-tile:nth-child(6) .module-icon { color:#6476b7; background:#eef1ff; }
    .calendar-preview { gap:clamp(3px,.6vw,6px); padding:clamp(8px,1.1vw,13px); }
    .preview-heading { color:#28354a; font-size:clamp(8px,1.1vw,13px); }
    .preview-days span { border-radius:5px; }
    @media (hover:hover) and (pointer:fine) {
      .module-tile:hover { transform:translateY(-2px); box-shadow:0 9px 24px rgba(27,39,65,.075); }
      .nav-icon:hover { background:#f3f5f9; color:#34435b; }
    }
    @media (max-width:600px) { .live-status { display:none; } .top-panel { padding-inline:5px; } .rail { padding-inline:3px; } .module-tile { padding:8px; } .module-empty { font-size:8px; } }
    @media (prefers-reduced-motion:reduce) { .module-tile:hover { transform:none; } }
    .tile {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
    }
    .tile:active, .calendar-control:active, .calendar-day:active {
      transform: scale(0.97);
      background-color: #edf0f6;
      border-color: #b9c3d5;
    }
    .tile:focus-visible, .calendar-control:focus-visible, .calendar-day:focus-visible {
      outline: 2px solid #9aa8c4;
      outline-offset: 2px;
    }
    @media (hover: hover) and (pointer: fine) {
      .tile:hover, .calendar-control:hover { border-color: #c4cad7; }
    }

    /* Compact calendar preview inside dashboard tile 1 */
    .calendar-preview {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      height: 100%;
      padding: clamp(5px, 0.8vw, 10px);
      text-align: left;
      color: #172033;
      pointer-events: none;
    }
    .preview-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 3px;
      font-size: clamp(7px, 1vw, 12px);
      font-weight: 750;
      white-space: nowrap;
    }
    .preview-arrow { color: #778095; font-size: 1.15em; }
    .preview-weekdays, .preview-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
    }
    .preview-weekdays span {
      overflow: hidden;
      color: #858b99;
      font-size: clamp(4px, 0.55vw, 7px);
      text-align: center;
      font-weight: 700;
    }
    .preview-days span {
      display: grid;
      place-items: center;
      min-width: 0;
      aspect-ratio: 1;
      border-radius: 3px;
      color: #5b6372;
      background: #f5f6f9;
      font-size: clamp(4px, 0.62vw, 8px);
      line-height: 1;
    }
    .preview-days span.positive { color: #159447; background: #edf8f0; }
    .preview-days span.negative { color: #e33c3c; background: #fff0ef; }
    .preview-days span.today { outline: 2px solid #536fae; outline-offset: -1px; color: #172033; font-weight: 850; background: #e5edff; }

    /* Bottom sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 250ms var(--ease-out), visibility 250ms;
    }
    .sheet-backdrop[data-open="true"] { opacity: 1; visibility: visible; pointer-events: auto; }
    .bottom-sheet {
      position: fixed;
      z-index: 21;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      height: 60vh;
      min-height: 0;
      max-height: 60vh;
      padding: 10px clamp(12px, 3vw, 28px) max(16px, env(safe-area-inset-bottom));
      overflow: auto;
      background: #fff;
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -8px 36px rgba(20, 24, 36, 0.12);
      transform: translateY(100%);
      transition: transform 380ms var(--ease-drawer);
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    .bottom-sheet[data-open="true"] { transform: translateY(0); }
    .sheet-handle-area {
      display: flex;
      flex: 0 0 25px;
      align-items: flex-start;
      justify-content: center;
      margin: -2px -12px 5px;
      padding: 2px 12px 8px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .sheet-handle-area:active { cursor: grabbing; }
    .sheet-handle { width: 46px; height: 5px; border-radius: 999px; background: #dedede; }
    .sheet-content { width: 100%; max-width: 760px; margin: 0 auto; }
    .sheet-placeholder { width: min(58%, 190px); height: 14px; margin: 4px 0 22px; border-radius: 999px; background: #d2d2d0; }
    .sheet-line { height: 10px; margin: 0 0 12px; border-radius: 999px; background: #ededeb; }
    .sheet-line.wide { width: 88%; }
    .sheet-line.medium { width: 62%; }
    .sheet-placeholder-card { height: 76px; margin-top: 28px; border-radius: 16px; background: #f7f7f6; }
    .calendar-full { display: none; width: 100%; max-width: 900px; margin: 0 auto; }
    .calendar-full[data-visible="true"] { display: block; }
    .generic-sheet[data-visible="false"] { display: none; }

    .calendar-header {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e7e9ef;
    }
    .calendar-title {
      margin: 0;
      color: #151b2c;
      font-size: clamp(18px, 4.4vw, 27px);
      font-weight: 750;
      text-align: center;
      white-space: nowrap;
    }
    .calendar-control {
      display: grid;
      place-items: center;
      width: 44px;
      height: 42px;
      padding: 0;
      color: #596174;
      background: #f7f8fb;
      border: 1px solid #dfe2eb;
      border-radius: 12px;
      cursor: pointer;
      font-size: 23px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
    }
    .calendar-weekdays, .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: clamp(3px, 0.7vw, 7px);
    }
    .calendar-weekdays { margin-top: 10px; }
    .calendar-weekdays span {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 27px;
      border-radius: 8px;
      background: #f0f1f6;
      color: #737987;
      font-size: clamp(8px, 2.1vw, 12px);
      font-weight: 750;
    }
    .calendar-days { margin-top: 5px; }
    .calendar-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, 0.7vw, 6px);
      min-width: 0;
      min-height: clamp(43px, 9.6vw, 68px);
      padding: 3px 1px;
      color: #111;
      background: #fff;
      border: 1px solid #dfe2e9;
      border-radius: 9px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
    }
    .calendar-day.empty { visibility: hidden; pointer-events: none; }
    .calendar-day.selected { background: #f0f4ff; border-color: #9aadd8; }
    .calendar-day.today { border: 2px solid #536fae; background: #eaf0ff; }
    .calendar-day.today .calendar-day-number { color: #294b91; font-weight: 850; }
    .calendar-day-number { font-size: clamp(11px, 3vw, 18px); font-weight: 650; line-height: 1; }
    .calendar-amount { font-size: clamp(7px, 2.05vw, 13px); font-weight: 750; line-height: 1; white-space: nowrap; }
    .calendar-amount.positive { color: #159b39; }
    .calendar-amount.negative { color: #e23b3b; }
    .calendar-amount.no-value { color: #b8bdc7; font-weight: 500; }
    .calendar-detail {
      min-height: 34px;
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #f7f8fa;
      color: #51596a;
      font-size: 12px;
      text-align: center;
    }
    .calendar-detail strong { color: #182033; }
    .calendar-detail .positive { color: #159b39; }
    .calendar-detail .negative { color: #e23b3b; }
    .history-panel[data-visible="false"] { display: none; }
    .history-panel { margin-top: 14px; padding: clamp(12px, 2.2vw, 20px); border: 1px solid #dfe2eb; border-radius: 16px; background: #fff; box-shadow: 0 2px 5px rgba(28,36,58,.045); }
    .history-heading { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 16px; padding-bottom:10px; border-bottom:1px solid #e7e9ef; }
    .history-title { margin:0; color:#151b2c; font-size:clamp(17px,3.6vw,23px); font-weight:750; }
    .history-totals { display:flex; flex-wrap:wrap; gap:8px 18px; color:#6d7483; font-size:clamp(11px,2.5vw,14px); }
    .history-totals strong { margin-left:4px; font-weight:800; white-space:nowrap; }
    .history-totals .deposit-total { color:#159b39; }
    .history-totals .withdrawal-total { color:#151515; }
    .history-list { display:grid; margin-top:8px; }
    .history-row { appearance:none; width:100%; display:grid; grid-template-columns:34px minmax(90px,.9fr) minmax(90px,1fr) minmax(90px,auto); align-items:center; gap:9px; min-height:48px; padding:5px 8px; border:0; border-bottom:1px solid #e7e9ef; border-radius:10px; background:transparent; color:#151b2c; font:inherit; font-size:clamp(11px,2.6vw,15px); text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform 140ms cubic-bezier(0.23,1,0.32,1), background-color 140ms ease, box-shadow 140ms ease; }
    .history-row:last-child { border-bottom:0; }
    .history-row:active { transform:scale(.985); background:#f0f4fa; }
    .history-row[aria-pressed="true"] { background:#f0f4fa; box-shadow:inset 0 0 0 1px #dce4f2; }
    .history-row:focus-visible { outline:2px solid #7189bb; outline-offset:2px; }
    @media (hover:hover) and (pointer:fine) { .history-row:hover { background:#f7f8fb; } }
    @media (prefers-reduced-motion:reduce) { .history-row { transition:background-color 100ms ease, box-shadow 100ms ease; } .history-row:active { transform:none; } }
    .history-kind-icon { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:#f0f2f8; color:#667086; font-size:22px; line-height:1; }
    .history-date { color:#697184; white-space:nowrap; }
    .history-type { font-weight:750; }
    .history-type.deposit, .history-amount.deposit { color:#159b39; }
    .history-type.withdrawal { color:#151515; }
    .history-amount { justify-self:end; font-weight:800; white-space:nowrap; }
    .history-empty { padding:20px 0; color:#858b99; text-align:center; font-size:13px; }
    @media (max-width:600px) {
      .goal-overview { grid-template-columns:minmax(0,1fr) 112px; gap:8px; }
      .goal-card { padding:12px 10px 9px; }
      .goal-topline { align-items:flex-start; flex-direction:column; gap:7px; }
      .goal-meta { width:100%; justify-content:space-between; }
      .goal-forecast { font-size:10px; }
      .goal-percent { font-size:22px; }
      .goal-values { font-size:17px; }
      .goal-values #goal-current { font-size:1.2em; }
      .goal-forecast-pin { font-size:9px; padding:4px 6px; }
      .deposit-summary { flex-direction:column; justify-content:center; align-items:flex-start; gap:9px; padding:10px; min-height:0; }
      .deposit-summary strong { font-size:22px; }
    }
    @media (prefers-reduced-motion:reduce) { .goal-fill { transition:none; } }
    @media (max-width:520px) { .history-row { grid-template-columns:28px minmax(76px,.9fr) minmax(75px,1fr) auto; gap:6px; } .history-kind-icon { width:26px; height:26px; } .history-totals { width:100%; justify-content:space-between; } }


    @media (prefers-reduced-motion: reduce) {
      .sheet-backdrop { transition: opacity 120ms ease; }
      .bottom-sheet { transition: opacity 120ms ease; transform: none; }
      .bottom-sheet[data-open="false"] { opacity: 0; visibility: hidden; }
      .bottom-sheet[data-open="true"] { opacity: 1; visibility: visible; }
      .tile, .calendar-control, .calendar-day { transition: background-color 100ms ease, border-color 100ms ease; }
      .tile:active, .calendar-control:active, .calendar-day:active { transform: none; background-color: #edf0f6; }
    }
  </style>
</head>
<body>
  <main class="dashboard" aria-label="Финансовая панель">
    <aside class="rail" aria-label="Основная навигация">
      <div class="brand-mark" aria-label="Romano">R</div>
      <nav class="rail-nav" aria-label="Разделы">
        <button class="nav-icon active" type="button" aria-label="Обзор" title="Обзор">⌂</button>
        <button class="nav-icon" type="button" aria-label="Аналитика" title="Аналитика">▥</button>
        <button class="nav-icon" type="button" aria-label="Операции" title="Операции">⇄</button>
      </nav>
      <div class="rail-bottom"><span class="profile-dot" aria-label="Профиль">R</span></div>
    </aside>
    <section class="workspace" aria-label="Рабочая область">
      <header class="top-panel">
        <div class="header-copy"><span class="eyebrow">PERSONAL FINANCE</span><h1>Обзор</h1></div>
        <div class="header-actions"><span class="live-status"><i></i> Все данные под контролем</span><span class="header-avatar">R</span></div>
      </header>
      <div class="grid" aria-label="Финансовые разделы">
        <div class="tile-row row-one">
          <button class="tile" id="calendar-launch" type="button" aria-label="Open current month calendar">
            <div class="calendar-preview" id="calendar-preview">
              
              <div class="preview-heading"><span id="preview-month">NOV 2026</span><span class="preview-arrow">↗</span></div>
              <div class="preview-weekdays"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
              <div class="preview-days" id="preview-days"></div>
            </div>
          </button>
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Баланс"><span class="module-top"><span class="module-icon">◈</span><span class="module-arrow">↗</span></span><span class="module-title">Баланс</span><span class="module-subtitle">Общий обзор</span><span class="module-empty">Добавьте данные</span></button>
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Доходы"><span class="module-top"><span class="module-icon">↗</span><span class="module-arrow">↗</span></span><span class="module-title">Доходы</span><span class="module-subtitle">Поступления</span><span class="module-empty">Добавьте данные</span></button>
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Расходы"><span class="module-top"><span class="module-icon">↘</span><span class="module-arrow">↗</span></span><span class="module-title">Расходы</span><span class="module-subtitle">Траты и платежи</span><span class="module-empty">Добавьте данные</span></button>
        </div>
        <div class="tile-row row-two">
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Накопления"><span class="module-top"><span class="module-icon">▤</span><span class="module-arrow">↗</span></span><span class="module-title">Накопления</span><span class="module-subtitle">Движение средств</span><span class="module-empty">Добавьте данные</span></button>
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Цели"><span class="module-top"><span class="module-icon">◎</span><span class="module-arrow">↗</span></span><span class="module-title">Цели</span><span class="module-subtitle">План накоплений</span><span class="module-empty">Добавьте данные</span></button>
        </div>
        <div class="tile-row row-three">
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Аналитика"><span class="module-top"><span class="module-icon">⌁</span><span class="module-arrow">↗</span></span><span class="module-title">Аналитика</span><span class="module-subtitle">Динамика</span><span class="module-empty">Добавьте данные</span></button>
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Платежи"><span class="module-top"><span class="module-icon">⇄</span><span class="module-arrow">↗</span></span><span class="module-title">Платежи</span><span class="module-subtitle">Регулярные операции</span><span class="module-empty">Добавьте данные</span></button>
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Активность"><span class="module-top"><span class="module-icon">◷</span><span class="module-arrow">↗</span></span><span class="module-title">Активность</span><span class="module-subtitle">Последние события</span><span class="module-empty">Добавьте данные</span></button>
        </div>
        <div class="tile-row row-four">
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Бюджет"><span class="module-top"><span class="module-icon">▦</span><span class="module-arrow">↗</span></span><span class="module-title">Бюджет</span><span class="module-subtitle">План на месяц</span><span class="module-empty">Добавьте данные</span></button>
          <button class="tile module-tile" type="button" aria-label="Открыть раздел: Заметки"><span class="module-top"><span class="module-icon">✳</span><span class="module-arrow">↗</span></span><span class="module-title">Заметки</span><span class="module-subtitle">Ваши финансовые планы</span><span class="module-empty">Добавьте данные</span></button>
        </div>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true" aria-label="Block details" aria-hidden="true" data-open="false">
    <div class="sheet-handle-area" id="sheet-handle-area" aria-label="Drag down to close"><span class="sheet-handle"></span></div>
    <div class="sheet-content">
      <div class="generic-sheet" id="generic-sheet" data-visible="true">
        <div class="sheet-placeholder"></div>
        <div class="sheet-line wide"></div>
        <div class="sheet-line medium"></div>
        <div class="sheet-placeholder-card"></div>
      </div>
      <div class="calendar-full" id="calendar-full" data-visible="false" aria-label="Monthly balance calendar">
        <section class="goal-overview" aria-label="Прогресс и депозит">
          <div class="goal-card">
            <div class="goal-topline">
              <div class="goal-values"><strong id="goal-current">$4,260</strong><span>/ $10,000</span></div>
              <div class="goal-meta"><span class="goal-forecast">Прогноз: <strong>$9,860</strong></span><strong class="goal-percent" id="goal-percent">42.6%</strong></div>
            </div>
            <div class="goal-track-wrap">
              <div class="goal-track" id="goal-track">
                <div class="goal-fill" id="goal-fill"></div>
                <span class="goal-forecast-marker" aria-hidden="true"></span>
                <span class="goal-forecast-pin" aria-hidden="true">Прогноз: <strong>$9,860</strong></span>
                <input class="goal-range" id="goal-range" type="range" min="0" max="10000" step="10" value="4260" aria-label="Текущий прогресс к цели от 0 до 10000 долларов">
              </div>
            </div>
            <div class="goal-hint">Передвигай ползунок, чтобы изменить текущий прогресс</div>
          </div>
          <div class="deposit-summary"><span>ДЕПОЗИТ</span><strong>$500</strong></div>
        </section>
        <div class="calendar-header">
          <button class="calendar-control" id="month-prev" type="button" aria-label="Previous month">←</button>
          <h2 class="calendar-title" id="calendar-title">July 2026</h2>
          <button class="calendar-control" id="month-next" type="button" aria-label="Next month">→</button>
        </div>
        <div class="calendar-weekdays">
          <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
        </div>
        <div class="calendar-days" id="calendar-days"></div>
        <div class="calendar-detail" id="calendar-detail" aria-live="polite">Выбери день, чтобы посмотреть сумму</div>
      </div>
      <section class="history-panel" id="history-panel" data-visible="false" aria-label="История операций">
        <div class="history-heading">
          <h2 class="history-title">История операций</h2>
          <div class="history-totals">
            <span>Пополнения: <strong class="deposit-total" id="history-deposits">+$0.00</strong></span>
            <span>Выводы: <strong class="withdrawal-total" id="history-withdrawals">−$0.00</strong></span>
          </div>
        </div>
        <div class="history-list" id="history-list"></div>
      </section>
    </div>
  </section>

  <script>
    const tiles = document.querySelectorAll(".tile");
    const calendarLaunch = document.getElementById("calendar-launch");
    const backdrop = document.getElementById("sheet-backdrop");
    const sheet = document.getElementById("bottom-sheet");
    const handle = document.getElementById("sheet-handle-area");
    const genericSheet = document.getElementById("generic-sheet");
    const calendarFull = document.getElementById("calendar-full");
    const calendarTitle = document.getElementById("calendar-title");
    const calendarDays = document.getElementById("calendar-days");
    const calendarDetail = document.getElementById("calendar-detail");
    const previewDays = document.getElementById("preview-days");
    const previewMonth = document.getElementById("preview-month");
    const historyPanel = document.getElementById("history-panel");
    const historyList = document.getElementById("history-list");
    const historyDeposits = document.getElementById("history-deposits");
    const historyWithdrawals = document.getElementById("history-withdrawals");
    const goalRange = document.getElementById("goal-range");
    const goalFill = document.getElementById("goal-fill");
    const goalCurrent = document.getElementById("goal-current");
    const goalPercent = document.getElementById("goal-percent");
    const goalTarget = 10000;
    const formatGoalMoney = value => "$" + Math.round(value).toLocaleString("en-US");
    function updateGoalProgress(value) {
      const amount = Math.max(0, Math.min(goalTarget, Number(value) || 0));
      const percent = amount / goalTarget;
      goalFill.style.transform = "scaleX(" + percent + ")";
      goalCurrent.textContent = formatGoalMoney(amount);
      goalPercent.textContent = (percent * 100).toFixed(1) + "%";
      goalRange.setAttribute("aria-valuetext", formatGoalMoney(amount) + " из " + formatGoalMoney(goalTarget));
    }
    goalRange.addEventListener("input", event => updateGoalProgress(event.currentTarget.value));

    let activeTile = null;
    let dragPointerId = null;
    let dragStartY = 0;
    let dragStartTime = 0;
    let dragDistance = 0;
    let calendarData = { currency: "USD", months: {} };
    const today = new Date();
    const todayKey = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
    let visibleMonth = new Date(Date.UTC(today.getFullYear(), today.getMonth(), 1));
    let selectedDate = null;

    const monthKey = date => date.getUTCFullYear() + "-" + String(date.getUTCMonth() + 1).padStart(2, "0");
    const monthLabel = date => new Intl.DateTimeFormat("en", { month: "long", year: "numeric", timeZone: "UTC" }).format(date);
    const money = value => new Intl.NumberFormat("en-US", { style: "currency", currency: calendarData.currency || "USD", signDisplay: "always" }).format(value);

    function monthDays(date) {
      const year = date.getUTCFullYear();
      const month = date.getUTCMonth();
      const count = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
      const mondayOffset = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7;
      return { count, offset: mondayOffset };
    }

    function renderPreview() {
      const key = monthKey(visibleMonth);
      const month = calendarData.months[key] || {};
      const { count, offset } = monthDays(visibleMonth);
      previewMonth.textContent = monthLabel(visibleMonth).toUpperCase();
      previewDays.innerHTML = "";
      for (let i = 0; i < offset; i++) {
        const blank = document.createElement("span");
        previewDays.appendChild(blank);
      }
      for (let day = 1; day <= count; day++) {
        const cell = document.createElement("span");
        const amount = month.days && month.days[String(day)];
        cell.textContent = day;
        if (typeof amount === "number") cell.classList.add(amount >= 0 ? "positive" : "negative");
        if (key + "-" + String(day).padStart(2, "0") === todayKey) cell.classList.add("today");
        previewDays.appendChild(cell);
      }
    }

    function renderHistory() {
      const transactions = Array.isArray(calendarData.history) ? calendarData.history.slice() : [];
      const deposits = transactions.filter(item => item.type === "deposit").reduce((sum, item) => sum + Math.max(0, Number(item.amount) || 0), 0);
      const withdrawals = transactions.filter(item => item.type === "withdrawal").reduce((sum, item) => sum + Math.abs(Math.min(0, Number(item.amount) || 0)), 0);
      historyDeposits.textContent = "+" + money(deposits);
      historyWithdrawals.textContent = "−" + money(withdrawals);
      historyList.innerHTML = "";
      transactions.sort((a, b) => b.date.localeCompare(a.date)).forEach(item => {
        const isDeposit = item.type === "deposit";
        const row = document.createElement("button");
        row.type = "button";
        row.className = "history-row";
        row.setAttribute("aria-pressed", "false");
        row.setAttribute("aria-label", (isDeposit ? "Пополнение " : "Вывод ") + money(Math.abs(Number(item.amount) || 0)) + ", " + item.date);
        row.addEventListener("click", () => {
          const wasSelected = row.getAttribute("aria-pressed") === "true";
          historyList.querySelectorAll(".history-row").forEach(button => button.setAttribute("aria-pressed", "false"));
          row.setAttribute("aria-pressed", String(!wasSelected));
        });
        const icon = document.createElement("span");
        icon.className = "history-kind-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = isDeposit ? "+" : "−";
        const date = document.createElement("time");
        date.className = "history-date";
        date.dateTime = item.date;
        date.textContent = new Date(item.date + "T12:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
        const type = document.createElement("span");
        type.className = "history-type " + (isDeposit ? "deposit" : "withdrawal");
        type.textContent = isDeposit ? "Пополнение" : "Вывод";
        const amount = document.createElement("strong");
        amount.className = "history-amount " + (isDeposit ? "deposit" : "withdrawal");
        amount.textContent = (isDeposit ? "+" : "−") + money(Math.abs(Number(item.amount) || 0));
        row.append(icon, date, type, amount);
        historyList.appendChild(row);
      });
      if (!transactions.length) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "Операций пока нет";
        historyList.appendChild(empty);
      }
    }

    function renderCalendar() {
      const key = monthKey(visibleMonth);
      const month = calendarData.months[key] || {};
      const { count, offset } = monthDays(visibleMonth);
      calendarTitle.textContent = monthLabel(visibleMonth);
      calendarDays.innerHTML = "";
      for (let i = 0; i < offset; i++) {
        const blank = document.createElement("div");
        blank.className = "calendar-day empty";
        blank.setAttribute("aria-hidden", "true");
        calendarDays.appendChild(blank);
      }
      for (let day = 1; day <= count; day++) {
        const value = month.days && month.days[String(day)];
        const dateKey = key + "-" + String(day).padStart(2, "0");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day";
        if (selectedDate === dateKey) button.classList.add("selected");
        if (dateKey === todayKey) {
          button.classList.add("today");
          button.setAttribute("aria-current", "date");
        }
        button.setAttribute("aria-label", monthLabel(visibleMonth) + " " + day + (typeof value === "number" ? ", " + money(value) : ", no amount recorded"));
        const number = document.createElement("span");
        number.className = "calendar-day-number";
        number.textContent = day;
        const amount = document.createElement("span");
        amount.className = "calendar-amount";
        if (typeof value === "number") {
          amount.textContent = money(value);
          amount.classList.add(value >= 0 ? "positive" : "negative");
        } else {
          amount.textContent = "—";
          amount.classList.add("no-value");
        }
        button.append(number, amount);
        button.addEventListener("click", () => {
          selectedDate = dateKey;
          renderCalendar();
          const signClass = typeof value === "number" ? (value >= 0 ? "positive" : "negative") : "";
          calendarDetail.innerHTML = "<strong>" + day + " " + monthLabel(visibleMonth) + "</strong>" +
            (typeof value === "number" ? " · <span class='" + signClass + "'>" + money(value) + "</span>" : " · Нет сохранённой суммы");
        });
        calendarDays.appendChild(button);
      }
    }

    function changeMonth(delta) {
      visibleMonth = new Date(Date.UTC(visibleMonth.getUTCFullYear(), visibleMonth.getUTCMonth() + delta, 1));
      selectedDate = null;
      calendarDetail.textContent = "Выбери день, чтобы посмотреть сумму";
      renderCalendar();
    }

    updateGoalProgress(goalRange.value);

    async function loadCalendarData() {
      try {
        const response = await fetch("./data/calendar.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Calendar data request failed");
        calendarData = await response.json();
      } catch (error) {
        console.error("Could not load calendar data", error);
      }
      renderPreview();
      renderCalendar();
      renderHistory();
    }

    function openSheet(tile, showCalendar) {
      activeTile = tile;
      genericSheet.dataset.visible = String(!showCalendar);
      calendarFull.dataset.visible = String(showCalendar);
      historyPanel.dataset.visible = String(showCalendar);
      sheet.style.transform = "";
      sheet.dataset.open = "true";
      sheet.setAttribute("aria-hidden", "false");
      backdrop.dataset.open = "true";
      document.body.classList.add("sheet-open");
      if (showCalendar) {
        visibleMonth = new Date(Date.UTC(today.getFullYear(), today.getMonth(), 1));
        selectedDate = todayKey;
        calendarDetail.textContent = "Сегодня · " + today.toLocaleDateString("ru-RU");
        renderCalendar();
        renderHistory();
      }
    }

    function closeSheet() {
      if (dragPointerId !== null) return;
      sheet.dataset.open = "false";
      sheet.setAttribute("aria-hidden", "true");
      backdrop.dataset.open = "false";
      document.body.classList.remove("sheet-open");
      sheet.style.transform = "";
      const tileToFocus = activeTile;
      activeTile = null;
      if (tileToFocus) tileToFocus.focus({ preventScroll: true });
    }

    tiles.forEach(tile => tile.addEventListener("click", () => openSheet(tile, tile === calendarLaunch)));
    document.getElementById("month-prev").addEventListener("click", () => changeMonth(-1));
    document.getElementById("month-next").addEventListener("click", () => changeMonth(1));
    backdrop.addEventListener("click", closeSheet);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && sheet.dataset.open === "true") closeSheet();
    });

    handle.addEventListener("pointerdown", event => {
      if (dragPointerId !== null || event.button !== 0) return;
      dragPointerId = event.pointerId;
      dragStartY = event.clientY;
      dragStartTime = performance.now();
      dragDistance = 0;
      sheet.style.transition = "none";
      handle.setPointerCapture(event.pointerId);
    });
    handle.addEventListener("pointermove", event => {
      if (event.pointerId !== dragPointerId) return;
      const rawDistance = event.clientY - dragStartY;
      dragDistance = rawDistance < 0 ? rawDistance * 0.18 : rawDistance;
      sheet.style.transform = "translateY(" + Math.max(-24, dragDistance) + "px)";
    });
    function finishDrag(event) {
      if (event.pointerId !== dragPointerId) return;
      const elapsed = Math.max(1, performance.now() - dragStartTime);
      const velocity = Math.max(0, dragDistance) / elapsed;
      const threshold = Math.max(110, sheet.getBoundingClientRect().height * 0.22);
      const shouldDismiss = dragDistance > threshold || velocity > 0.11;
      dragPointerId = null;
      sheet.style.transition = "";
      if (shouldDismiss) closeSheet();
      else sheet.style.transform = "";
    }
    handle.addEventListener("pointerup", finishDrag);
    handle.addEventListener("pointercancel", finishDrag);
    handle.addEventListener("lostpointercapture", event => {
      if (event.pointerId === dragPointerId) finishDrag(event);
    });

    loadCalendarData();
  </script>
</body>
</html>
