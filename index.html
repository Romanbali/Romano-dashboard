<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Romano Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f7fb;
      --surface: #ffffff;
      --stroke: #d9dce5;
      --radius: clamp(12px, 2vw, 20px);
      --space: clamp(7px, 1.45vw, 16px);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      padding: clamp(8px, 1.35vw, 15px);
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--page);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body.sheet-open { overflow: hidden; }

    .dashboard {
      display: grid;
      grid-template-columns: clamp(30px, 4.55vw, 50px) minmax(0, 1fr);
      gap: clamp(10px, 1.65vw, 18px);
      width: 100%;
      min-width: 0;
    }
    .rail, .top-panel, .tile {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: 0 2px 5px rgba(28, 36, 58, 0.055);
    }
    .rail { min-height: clamp(590px, 86vh, 900px); }
    .workspace {
      display: grid;
      grid-template-rows: clamp(42px, 6.2vw, 68px) auto;
      gap: clamp(10px, 1.65vw, 18px);
      min-width: 0;
    }
    .top-panel { min-width: 0; }
    .goal-overview { display:block; width:100%; margin-bottom:18px; }
    .goal-card { display:flex; flex-direction:column; min-width:0; width:100%; padding:14px clamp(12px,2.2vw,22px) 13px; border:1px solid #e0e5ee; border-radius:17px; background:linear-gradient(120deg,#fff 0%,#fbfcff 100%); box-shadow:0 2px 7px rgba(28,36,58,.045); }
    .goal-topline { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .goal-values { display:grid; grid-template-columns:max-content max-content minmax(0,1fr); align-items:baseline; column-gap:12px; width:100%; min-width:0; white-space:nowrap; font-size:clamp(17px,3.2vw,30px); font-weight:800; letter-spacing:-.045em; color:#626b7d; font-variant-numeric:tabular-nums; }
    .deposit-summary { justify-self:end; margin-left:0; }
    .goal-values #goal-current { color:#159447; font-size:1.28em; }
    .goal-track-wrap { position:static; padding:20px 0 4px; }
    .goal-track { position:relative; height:clamp(15px,3.2vw,24px); border-radius:999px; background:#e5e8ee; }
    .goal-percent { position:absolute; top:50%; left:0; z-index:1; color:#159447; font-size:clamp(15px,2.7vw,21px); font-weight:800; letter-spacing:-.04em; line-height:1; white-space:nowrap; font-variant-numeric:tabular-nums; transform:translate3d(0,-50%,0); transition:transform 180ms var(--ease-out); pointer-events:none; }
    .goal-fill { position:absolute; inset:0 auto 0 0; width:100%; border-radius:inherit; background:linear-gradient(90deg,#39ed72,#13b94c); transform:scaleX(.426); transform-origin:left center; transition:transform 180ms var(--ease-out); }
    .deposit-summary {
      display:inline-flex;
      align-items:baseline;
      gap:6px;
      margin:0 0 0 2px;
      padding:0;
      color:#596579;
      background:transparent;
      border:0;
      border-radius:0;
      box-shadow:none;
      white-space:nowrap;
    }
    .deposit-summary span {
      font-size:clamp(9px,1.3vw,11px);
      letter-spacing:.08em;
      font-weight:800;
      line-height:1;
    }
    .deposit-summary strong {
      color:#2563eb;
      font-size:1em;
      letter-spacing:-.035em;
      font-weight:800;
      line-height:1;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }
    .grid {
      display: grid;
      grid-template-rows: repeat(4, clamp(110px, 26vw, 180px));
      gap: var(--space);
      min-width: 0;
    }
    .tile-row { display: grid; gap: var(--space); min-width: 0; }
    .row-one { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .row-two { grid-template-columns: 2fr 1fr; }
    .row-three { grid-template-columns: 1fr 1fr 2fr; }
    .row-four { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .tile {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
    }
    .tile:active, .calendar-control:active, .calendar-day:active {
      transform: scale(0.97);
      background-color: #edf0f6;
      border-color: #b9c3d5;
    }
    .tile:focus-visible, .calendar-control:focus-visible, .calendar-day:focus-visible {
      outline: 2px solid #9aa8c4;
      outline-offset: 2px;
    }
    @media (hover: hover) and (pointer: fine) {
      .tile:hover, .calendar-control:hover { border-color: #c4cad7; }
    }

    /* Compact calendar preview inside dashboard tile 1 */
    .calendar-preview {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      height: 100%;
      padding: clamp(5px, 0.8vw, 10px);
      text-align: left;
      color: #172033;
      pointer-events: none;
    }
    .preview-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 3px;
      font-size: clamp(7px, 1vw, 12px);
      font-weight: 750;
      white-space: nowrap;
    }
    .preview-arrow { color: #778095; font-size: 1.15em; }
    .preview-weekdays, .preview-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
    }
    .preview-weekdays span {
      overflow: hidden;
      color: #858b99;
      font-size: clamp(4px, 0.55vw, 7px);
      text-align: center;
      font-weight: 700;
    }
    .preview-days span {
      display: grid;
      place-items: center;
      min-width: 0;
      aspect-ratio: 1;
      border-radius: 3px;
      color: #5b6372;
      background: #f5f6f9;
      font-size: clamp(4px, 0.62vw, 8px);
      line-height: 1;
    }
    .preview-days span.positive { color: #159447; background: #edf8f0; }
    .preview-days span.negative { color: #e33c3c; background: #fff0ef; }
    .preview-days span.today { outline: 2px solid #536fae; outline-offset: -1px; color: #172033; font-weight: 850; background: #e5edff; }

    /* Bottom sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 250ms var(--ease-out), visibility 250ms;
    }
    .sheet-backdrop[data-open="true"] { opacity: 1; visibility: visible; pointer-events: auto; }
    .bottom-sheet {
      position: fixed;
      z-index: 21;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      height: 60vh;
      min-height: 0;
      max-height: 60vh;
      padding: 10px clamp(12px, 3vw, 28px) max(16px, env(safe-area-inset-bottom));
      overflow: auto;
      background: #fff;
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -8px 36px rgba(20, 24, 36, 0.12);
      transform: translateY(100%);
      transition: transform 380ms var(--ease-drawer);
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    .bottom-sheet[data-open="true"] { transform: translateY(0); }
    .sheet-handle-area {
      display: flex;
      flex: 0 0 25px;
      align-items: flex-start;
      justify-content: center;
      margin: -2px -12px 5px;
      padding: 2px 12px 8px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .sheet-handle-area:active { cursor: grabbing; }
    .sheet-handle { width: 46px; height: 5px; border-radius: 999px; background: #dedede; }
    .sheet-content { width: 100%; max-width: 760px; margin: 0 auto; }
    .sheet-placeholder { width: min(58%, 190px); height: 14px; margin: 4px 0 22px; border-radius: 999px; background: #d2d2d0; }
    .sheet-line { height: 10px; margin: 0 0 12px; border-radius: 999px; background: #ededeb; }
    .sheet-line.wide { width: 88%; }
    .sheet-line.medium { width: 62%; }
    .sheet-placeholder-card { height: 76px; margin-top: 28px; border-radius: 16px; background: #f7f7f6; }
    .calendar-full { display: none; width: 100%; max-width: 900px; margin: 0 auto; }
    .calendar-full[data-visible="true"] { display: block; }
    .generic-sheet[data-visible="false"] { display: none; }

    .calendar-header {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e7e9ef;
    }
    .calendar-title {
      margin: 0;
      color: #151b2c;
      font-size: clamp(18px, 4.4vw, 27px);
      font-weight: 750;
      text-align: center;
      white-space: nowrap;
    }
    .calendar-control {
      display: grid;
      place-items: center;
      width: 44px;
      height: 42px;
      padding: 0;
      color: #596174;
      background: #f7f8fb;
      border: 1px solid #dfe2eb;
      border-radius: 12px;
      cursor: pointer;
      font-size: 23px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
    }
    .calendar-weekdays, .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: clamp(3px, 0.7vw, 7px);
    }
    .calendar-weekdays { margin-top: 10px; }
    .calendar-weekdays span {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 27px;
      border-radius: 8px;
      background: #f0f1f6;
      color: #737987;
      font-size: clamp(8px, 2.1vw, 12px);
      font-weight: 750;
    }
    .calendar-days { margin-top: 5px; }
    .calendar-days[data-range-selecting="true"] { touch-action:none; }
    .calendar-day {
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      touch-action:pan-y;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, 0.7vw, 6px);
      min-width: 0;
      min-height: clamp(43px, 9.6vw, 68px);
      padding: 3px 1px;
      color: #111;
      background: #fff;
      border: 1px solid #dfe2e9;
      border-radius: 9px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease;
    }
    .calendar-day.empty { visibility: hidden; pointer-events: none; }
    .calendar-day.selected { background: #f0f4ff; border-color: #9aadd8; }
    .calendar-day.today { border: 2px solid #536fae; background: #eaf0ff; }
    .calendar-day.today .calendar-day-number { color: #294b91; font-weight: 850; }
    .calendar-day-number { font-size: clamp(11px, 3vw, 18px); font-weight: 650; line-height: 1; }
    .calendar-amount { font-size: clamp(7px, 2.05vw, 13px); font-weight: 750; line-height: 1; white-space: nowrap; }
    .calendar-amount.positive { color: #159b39; }
    .calendar-amount.negative { color: #e23b3b; }
    .calendar-amount.no-value { color: #b8bdc7; font-weight: 500; }
    .calendar-day.range-start,
    .calendar-day.range-end { position:relative; z-index:1; background:#536fe0; border-color:#536fe0; color:#fff; }
    .calendar-day.range-start .calendar-day-number,
    .calendar-day.range-end .calendar-day-number { color:#fff; }
    .calendar-day.in-range { background:#edf1ff; border-color:#edf1ff; border-radius:5px; }
    .calendar-day.range-start { border-radius:12px 5px 5px 12px; }
    .calendar-day.range-end { border-radius:5px 12px 12px 5px; }
    .calendar-editor { margin-top:12px; padding:14px; border:1px solid #dfe4ef; border-radius:15px; background:#fff; box-shadow:0 5px 18px rgba(33,48,82,.07); }
    .calendar-editor[hidden] { display:none; }
    .editor-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; color:#172033; font-size:15px; font-weight:800; }
    .editor-close { display:grid; place-items:center; width:30px; height:30px; border:0; border-radius:9px; background:#f1f3f8; color:#596274; font-size:19px; cursor:pointer; }
    .editor-hint { margin:0 0 12px; color:#788194; font-size:12px; line-height:1.4; }
    .editor-range { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-bottom:12px; }
    .editor-date { min-width:0; padding:9px 10px; border:1px solid #e2e6ee; border-radius:10px; background:#f8f9fc; color:#202a3d; font-size:12px; font-weight:700; text-align:center; }
    .editor-amount-label { display:block; margin-bottom:6px; color:#566074; font-size:12px; font-weight:750; }
    .editor-amount { width:100%; min-height:44px; padding:9px 12px; border:1px solid #dce2ec; border-radius:11px; outline:none; background:#fff; color:#172033; font:inherit; font-size:18px; font-weight:750; font-variant-numeric:tabular-nums; }
    .editor-amount:focus { border-color:#7188c8; box-shadow:0 0 0 3px rgba(83,111,174,.12); }
    .editor-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:12px; }
    .editor-kind-actions { display:flex; align-items:center; gap:8px; margin-right:auto; }
    .editor-kind-actions[hidden] { display:none; }
    .editor-kind-button { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:8px 13px; border:1px solid currentColor; border-radius:9px; background:#fff; font:inherit; font-size:13px; font-weight:750; white-space:nowrap; cursor:pointer; transition:transform 140ms var(--ease-out), background-color 140ms ease; }
    .editor-kind-button.deposit { color:#22bd59; }
    .editor-kind-button.withdrawal { color:#ff3b30; }
    .editor-kind-button:active { transform:scale(.94); }
    @media (hover:hover) and (pointer:fine) {
      .editor-kind-button.deposit:hover { background:#eaf9ef; }
      .editor-kind-button.withdrawal:hover { background:#fff0ef; }
    }
    @media (prefers-reduced-motion:reduce) { .editor-kind-button { transition:none; } }
    .editor-button { min-height:40px; padding:8px 15px; border:1px solid #e0e4ed; border-radius:10px; background:#f7f8fb; color:#596274; font:inherit; font-size:13px; font-weight:750; cursor:pointer; transition:transform 140ms var(--ease-out), background-color 140ms ease; }
    .editor-button.primary { border-color:#536fe0; background:#536fe0; color:#fff; }
    .editor-button:active { transform:scale(.97); }
    .editor-button:focus-visible,.editor-close:focus-visible { outline:2px solid #7189bb; outline-offset:2px; }
    @media (hover:hover) and (pointer:fine) { .editor-button:hover { background:#edf0f7; } .editor-button.primary:hover { background:#465fca; } }
    @media (prefers-reduced-motion:reduce) { .editor-button { transition:background-color 100ms ease; } .editor-button:active { transform:none; } }
    .deposit-dialog-backdrop { position:fixed; inset:0; z-index:10020; display:grid; place-items:center; padding:16px; overflow-y:auto; box-sizing:border-box; background:rgba(20,27,42,.42); opacity:1; transition:opacity 220ms var(--ease-out); }
    .deposit-dialog-backdrop.keyboard-open { place-items:start center; padding-top:12px; }
    .deposit-dialog-backdrop.keyboard-open .deposit-dialog { max-height:calc(100% - 24px); transform:none; }
    .deposit-dialog-backdrop[hidden] { display:none; }
    .deposit-dialog { width:min(100%,390px); max-height:calc(100% - 8px); overflow-y:auto; box-sizing:border-box; padding:18px; border:1px solid #e0e4ed; border-radius:18px; background:#fff; box-shadow:0 18px 55px rgba(20,30,55,.2); opacity:1; transform:scale(1); transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out); }
    .deposit-dialog-backdrop[hidden] .deposit-dialog { opacity:0; transform:scale(.96); }
    @media (prefers-reduced-motion:reduce) { .deposit-dialog-backdrop,.deposit-dialog { transition:opacity 100ms ease; } .deposit-dialog-backdrop:not([hidden]) .deposit-dialog { transform:none; } }
    .calendar-detail {
      min-height: 34px;
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #f7f8fa;
      color: #51596a;
      font-size: 12px;
      text-align: center;
    }
    .calendar-detail strong { color: #182033; }
    .calendar-detail .positive { color: #159b39; }
    .calendar-detail .negative { color: #e23b3b; }
    .history-panel[data-visible="false"] { display: none; }
    .history-panel { margin-top: 14px; padding: clamp(12px, 2.2vw, 20px); border: 1px solid #dfe2eb; border-radius: 16px; background: #fff; box-shadow: 0 2px 5px rgba(28,36,58,.045); }
    .history-heading { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 16px; padding-bottom:10px; border-bottom:1px solid #e7e9ef; }
    .history-title { margin:0; color:#151b2c; font-size:clamp(17px,3.6vw,23px); font-weight:750; }
    .history-totals { display:flex; flex-wrap:wrap; gap:8px 18px; color:#6d7483; font-size:clamp(11px,2.5vw,14px); }
    .history-totals strong { margin-left:4px; font-weight:800; white-space:nowrap; }
    .history-totals .deposit-total { color:#159b39; }
    .history-totals .withdrawal-total { color:#151515; }
    .history-list { display:grid; margin-top:8px; }
    .history-row { appearance:none; width:100%; display:grid; grid-template-columns:34px minmax(90px,.9fr) minmax(90px,1fr) minmax(90px,auto); align-items:center; gap:9px; min-height:48px; padding:5px 8px; border:0; border-bottom:1px solid #e7e9ef; border-radius:10px; background:transparent; color:#151b2c; font:inherit; font-size:clamp(11px,2.6vw,15px); text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform 140ms cubic-bezier(0.23,1,0.32,1), background-color 140ms ease, box-shadow 140ms ease; }
    .history-row:last-child { border-bottom:0; }
    .history-row:active { transform:scale(.985); background:#f0f4fa; }
    .history-row[aria-pressed="true"] { background:#f0f4fa; box-shadow:inset 0 0 0 1px #dce4f2; }
    .history-row:focus-visible { outline:2px solid #7189bb; outline-offset:2px; }
    @media (hover:hover) and (pointer:fine) { .history-row:hover { background:#f7f8fb; } }
    @media (prefers-reduced-motion:reduce) { .history-row { transition:background-color 100ms ease, box-shadow 100ms ease; } .history-row:active { transform:none; } }
    .history-kind-icon { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:#f0f2f8; color:#667086; font-size:22px; line-height:1; }
    .history-date { color:#697184; white-space:nowrap; }
    .history-type { font-weight:750; }
    .history-type.deposit, .history-amount.deposit { color:#159b39; }
    .history-type.withdrawal { color:#151515; }
    .history-amount { justify-self:end; font-weight:800; white-space:nowrap; }
    .history-empty { padding:20px 0; color:#858b99; text-align:center; font-size:13px; }
    @media (max-width:600px) {
      .goal-overview { grid-template-columns:minmax(0,1fr) 112px; gap:8px; }
      .goal-card { padding:12px 10px 9px; }
      .goal-topline { align-items:flex-start; flex-direction:column; gap:7px; }
      .goal-values { column-gap:9px; }
      .goal-meta { width:100%; justify-content:space-between; }
      .goal-forecast { font-size:10px; }
      .goal-percent { font-size:22px; }
      .goal-values { font-size:17px; }
      .goal-values #goal-current { font-size:1.2em; }
      .goal-forecast-pin { font-size:9px; padding:4px 6px; }
      .deposit-summary { gap:4px; }
      .deposit-summary span { font-size:8px; }
      .deposit-summary strong { font-size:1em; }
    }
    @media (prefers-reduced-motion:reduce) { .goal-fill, .goal-percent { transition:none; } }
    @media (max-width:520px) { .history-row { grid-template-columns:28px minmax(76px,.9fr) minmax(75px,1fr) auto; gap:6px; } .history-kind-icon { width:26px; height:26px; } .history-totals { width:100%; justify-content:space-between; } }


    @media (prefers-reduced-motion: reduce) {
      .sheet-backdrop { transition: opacity 120ms ease; }
      .bottom-sheet { transition: opacity 120ms ease; transform: none; }
      .bottom-sheet[data-open="false"] { opacity: 0; visibility: hidden; }
      .bottom-sheet[data-open="true"] { opacity: 1; visibility: visible; }
      .tile, .calendar-control, .calendar-day { transition: background-color 100ms ease, border-color 100ms ease; }
      .tile:active, .calendar-control:active, .calendar-day:active { transform: none; background-color: #edf0f6; }
    }
  </style>
</head>
<body>
  <main class="dashboard" aria-label="Dashboard layout">
    <aside class="rail" aria-hidden="true"></aside>
    <section class="workspace" aria-label="Dashboard workspace">
      <header class="top-panel" aria-hidden="true"></header>
      <div class="grid" aria-label="Dashboard blocks">
        <div class="tile-row row-one">
          <button class="tile" id="calendar-launch" type="button" aria-label="Open current month calendar">
            <div class="calendar-preview" id="calendar-preview">
              
              <div class="preview-heading"><span id="preview-month">NOV 2026</span><span class="preview-arrow">↗</span></div>
              <div class="preview-weekdays"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
              <div class="preview-days" id="preview-days"></div>
            </div>
          </button>
          <button class="tile" type="button" aria-label="Open block 2"></button>
          <button class="tile" type="button" aria-label="Open block 3"></button>
          <button class="tile" type="button" aria-label="Open block 4"></button>
        </div>
        <div class="tile-row row-two">
          <button class="tile" type="button" aria-label="Open block 5"></button>
          <button class="tile" type="button" aria-label="Open block 6"></button>
        </div>
        <div class="tile-row row-three">
          <button class="tile" type="button" aria-label="Open block 7"></button>
          <button class="tile" type="button" aria-label="Open block 8"></button>
          <button class="tile" type="button" aria-label="Open block 9"></button>
        </div>
        <div class="tile-row row-four">
          <button class="tile" type="button" aria-label="Open block 10"></button>
          <button class="tile" type="button" aria-label="Open block 11"></button>
        </div>
      </div>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true" aria-label="Block details" aria-hidden="true" data-open="false">
    <div class="sheet-handle-area" id="sheet-handle-area" aria-label="Drag down to close"><span class="sheet-handle"></span></div>
    <div class="sheet-content">
      <div class="generic-sheet" id="generic-sheet" data-visible="true">
        <div class="sheet-placeholder"></div>
        <div class="sheet-line wide"></div>
        <div class="sheet-line medium"></div>
        <div class="sheet-placeholder-card"></div>
      </div>
      <div class="calendar-full" id="calendar-full" data-visible="false" aria-label="Monthly balance calendar">
        <section class="goal-overview" aria-label="Прогресс и депозит">
          <div class="goal-card">
            <div class="goal-topline">
              <div class="goal-values"><strong id="goal-current">$0</strong><span>/ <strong id="goal-total">$0</strong></span><div class="deposit-summary"><span>ДЕПОЗИТ</span><strong id="deposit-value">$500.00</strong></div></div>
            </div>
            <div class="goal-track-wrap">
              <div class="goal-track" id="goal-track" role="progressbar" aria-label="Сумма за месяц до сегодняшнего дня" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="goal-fill" id="goal-fill"></div>
                <strong class="goal-percent" id="goal-percent">0.0%</strong>
              </div>
            </div>
          </div>
        </section>
        <div class="calendar-header">
          <button class="calendar-control" id="month-prev" type="button" aria-label="Previous month">←</button>
          <h2 class="calendar-title" id="calendar-title">July 2026</h2>
          <button class="calendar-control" id="month-next" type="button" aria-label="Next month">→</button>
        </div>
        <div class="calendar-weekdays">
          <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
        </div>
        <div class="calendar-days" id="calendar-days"></div>
        <section class="calendar-editor" id="calendar-editor" hidden aria-label="Редактор сумм календаря">
          <div class="editor-heading"><span>Изменить сумму</span><button class="editor-close" id="editor-close" type="button" aria-label="Закрыть редактор">×</button></div>
          <p class="editor-hint" id="editor-hint">Выбери конечную дату диапазона или оставь один день</p>
          <div class="editor-range"><div class="editor-date" id="editor-start-date">—</div><span>→</span><div class="editor-date" id="editor-end-date">—</div></div>
          <label class="editor-amount-label" for="editor-amount">Сумма в USD (можно отрицательную)</label>
          <input class="editor-amount" id="editor-amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
          <div class="editor-actions">
            <div class="editor-kind-actions" id="editor-kind-actions" hidden>
              <button class="editor-kind-button withdrawal" id="editor-withdrawal" type="button" aria-label="Вывод" title="Вывод">Вывести</button>
              <button class="editor-kind-button deposit" id="editor-deposit" type="button" aria-label="Пополнение" title="Пополнение">Пополнить</button>
            </div>
            <button class="editor-button" id="editor-cancel" type="button">Отмена</button><button class="editor-button primary" id="editor-apply" type="button">Сохранить сумму</button>
          </div>
        </section>
        <div class="deposit-dialog-backdrop" id="deposit-dialog-backdrop" hidden>
          <section class="deposit-dialog" role="dialog" aria-modal="true" aria-labelledby="deposit-dialog-title">
            <div class="editor-heading"><span id="deposit-dialog-title">Пополнение депозита</span><button class="editor-close" id="deposit-dialog-close" type="button" aria-label="Закрыть">×</button></div>
            <p class="editor-hint" id="deposit-dialog-hint">Укажи сумму операции в USD</p>
            <label class="editor-amount-label" for="deposit-dialog-amount">Сумма в USD</label>
            <input class="editor-amount" id="deposit-dialog-amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00">
            <div class="editor-actions">
              <button class="editor-button" id="deposit-dialog-cancel" type="button">Отмена</button>
              <button class="editor-button primary" id="deposit-dialog-submit" type="button">Пополнить</button>
            </div>
          </section>
        </div>
        <div class="calendar-detail" id="calendar-detail" aria-live="polite">Выбери день, чтобы посмотреть сумму</div>
      </div>
      <section class="history-panel" id="history-panel" data-visible="false" aria-label="История операций">
        <div class="history-heading">
          <h2 class="history-title">История операций</h2>
          <div class="history-totals">
            <span>Пополнения: <strong class="deposit-total" id="history-deposits">+$0.00</strong></span>
            <span>Выводы: <strong class="withdrawal-total" id="history-withdrawals">−$0.00</strong></span>
          </div>
        </div>
        <div class="history-list" id="history-list"></div>
      </section>
    </div>
  </section>

  <script>
    const tiles = document.querySelectorAll(".tile");
    const calendarLaunch = document.getElementById("calendar-launch");
    const backdrop = document.getElementById("sheet-backdrop");
    const sheet = document.getElementById("bottom-sheet");
    const handle = document.getElementById("sheet-handle-area");
    const genericSheet = document.getElementById("generic-sheet");
    const calendarFull = document.getElementById("calendar-full");
    const calendarTitle = document.getElementById("calendar-title");
    const calendarDays = document.getElementById("calendar-days");
    const calendarDetail = document.getElementById("calendar-detail");
    const calendarEditor = document.getElementById("calendar-editor");
    const editorHint = document.getElementById("editor-hint");
    const editorStartDate = document.getElementById("editor-start-date");
    const editorEndDate = document.getElementById("editor-end-date");
    const editorAmount = document.getElementById("editor-amount");
    const editorKindActions = document.getElementById("editor-kind-actions");
    const editorDeposit = document.getElementById("editor-deposit");
    const editorWithdrawal = document.getElementById("editor-withdrawal");
    const depositDialogBackdrop = document.getElementById("deposit-dialog-backdrop");
    const depositDialogTitle = document.getElementById("deposit-dialog-title");
    const depositDialogAmount = document.getElementById("deposit-dialog-amount");
    const depositDialogSubmit = document.getElementById("deposit-dialog-submit");
    function syncDepositDialogViewport() {
      const viewport = window.visualViewport;
      if (!viewport) return;
      const keyboardOpen = viewport.height < window.innerHeight * 0.78;
      depositDialogBackdrop.classList.toggle("keyboard-open", keyboardOpen);
      depositDialogBackdrop.style.top = viewport.offsetTop + "px";
      depositDialogBackdrop.style.left = viewport.offsetLeft + "px";
      depositDialogBackdrop.style.width = viewport.width + "px";
      depositDialogBackdrop.style.height = viewport.height + "px";
      depositDialogBackdrop.style.bottom = "auto";
      if (keyboardOpen) depositDialogBackdrop.style.paddingBottom = "12px";
      else depositDialogBackdrop.style.paddingBottom = "";
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncDepositDialogViewport);
      window.visualViewport.addEventListener("scroll", syncDepositDialogViewport);
    }
    window.addEventListener("resize", syncDepositDialogViewport);
    syncDepositDialogViewport();
    const depositValue = document.getElementById("deposit-value");
    const previewDays = document.getElementById("preview-days");
    const previewMonth = document.getElementById("preview-month");
    const historyPanel = document.getElementById("history-panel");
    const historyList = document.getElementById("history-list");
    const historyDeposits = document.getElementById("history-deposits");
    const historyWithdrawals = document.getElementById("history-withdrawals");
    const goalFill = document.getElementById("goal-fill");
    const goalCurrent = document.getElementById("goal-current");
    const goalTotal = document.getElementById("goal-total");
    const goalPercent = document.getElementById("goal-percent");
    const goalTrack = document.getElementById("goal-track");
    const formatGoalMoney = value => "$" + Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    function updateGoalProgress(monthDate) {
      const key = monthKey(monthDate);
      const month = calendarData.months[key] || {};
      const days = month.days || {};
      const todayMonth = monthKey(new Date(Date.UTC(today.getFullYear(), today.getMonth(), 1)));
      const cutoff = key < todayMonth ? 31 : key > todayMonth ? 0 : today.getDate();
      const values = Object.entries(days).filter(([day, value]) => Number(day) <= cutoff && typeof value === "number").map(([, value]) => value);
      const monthValues = Object.values(days).filter(value => typeof value === "number");
      const currentTotal = values.reduce((sum, value) => sum + value, 0);
      const monthTotal = monthValues.reduce((sum, value) => sum + value, 0);
      const percent = monthTotal > 0 ? Math.max(0, Math.min(1, currentTotal / monthTotal)) : 0;
      goalFill.style.transform = "scaleX(" + percent + ")";
      goalCurrent.textContent = formatGoalMoney(currentTotal);
      goalCurrent.style.color = currentTotal < 0 ? "#d99a16" : "#159447";
      goalTotal.textContent = formatGoalMoney(monthTotal);
      goalPercent.textContent = (percent * 100).toFixed(1) + "%";
      const trackWidth = goalTrack.clientWidth;
      const labelWidth = goalPercent.getBoundingClientRect().width;
      const barEnd = percent * trackWidth;
      const labelX = barEnd + labelWidth + 10 <= trackWidth ? barEnd + 8 : Math.max(0, barEnd - labelWidth - 8);
      goalPercent.style.transform = "translate3d(" + labelX + "px, -50%, 0)";
      goalTrack.setAttribute("aria-valuenow", (percent * 100).toFixed(1));
      goalTrack.setAttribute("aria-valuetext", formatGoalMoney(currentTotal) + " из " + formatGoalMoney(monthTotal));
    }

    let activeTile = null;
    let dragPointerId = null;
    let dragStartY = 0;
    let dragStartTime = 0;
    let dragDistance = 0;
    let calendarData = { currency: "USD", months: {} };
    const today = new Date();
    const todayKey = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
    let visibleMonth = new Date(Date.UTC(today.getFullYear(), today.getMonth(), 1));
    let selectedDate = null;
    let editorActive = false;
    let rangeStart = null;
    let rangeEnd = null;
    let selectingRangeEnd = false;
    let holdTimer = null;
    let holdPointerId = null;
    let holdStarted = false;
    let rangePointerId = null;
    let rangePointerMoved = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    const calendarStorageKey = "romano-calendar-data-v1";
    const depositStorageKey = "romano-deposit-amount-v1";
    const depositHistoryStorageKey = "romano-deposit-history-v1";
    let depositAmount = 500;

    function renderDepositAmount() {
      depositValue.textContent = "$" + depositAmount.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
    }
    function saveDepositAmount() {
      try { localStorage.setItem(depositStorageKey, String(depositAmount)); } catch (error) { console.warn("Could not save deposit amount", error); }
      renderDepositAmount();
    }
    function saveDepositHistory() {
      try {
        const operations = Array.isArray(calendarData.history) ? calendarData.history : [];
        localStorage.setItem(depositHistoryStorageKey, JSON.stringify(operations.filter(item => item.source === "deposit-dialog")));
      } catch (error) { console.warn("Could not save deposit history", error); }
    }
    function restoreDepositHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(depositHistoryStorageKey) || "[]");
        if (!Array.isArray(saved)) return;
        const existingIds = new Set((Array.isArray(calendarData.history) ? calendarData.history : []).map(item => item.id));
        calendarData.history = (Array.isArray(calendarData.history) ? calendarData.history : []).concat(saved.filter(item => item && item.source === "deposit-dialog" && !existingIds.has(item.id)));
      } catch (error) { console.warn("Could not restore deposit history", error); }
    }
    function deleteHistoryTransaction(item) {
      if (!item || !Array.isArray(calendarData.history)) return;
      const amount = Number(item.amount) || 0;
      if (!window.confirm("Удалить эту операцию? Изменение депозита будет отменено.")) return;
      if (item.source === "deposit-dialog") {
        depositAmount = Math.round((depositAmount - amount) * 100) / 100;
        saveDepositAmount();
      }
      calendarData.history = calendarData.history.filter(entry => entry.id !== item.id);
      saveDepositHistory();
      renderHistory();
    }

    const monthKey = date => date.getUTCFullYear() + "-" + String(date.getUTCMonth() + 1).padStart(2, "0");
    const monthLabel = date => new Intl.DateTimeFormat("en", { month: "long", year: "numeric", timeZone: "UTC" }).format(date);
    const money = value => new Intl.NumberFormat("en-US", { style: "currency", currency: calendarData.currency || "USD", signDisplay: "always" }).format(value);

    function monthDays(date) {
      const year = date.getUTCFullYear();
      const month = date.getUTCMonth();
      const count = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
      const mondayOffset = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7;
      return { count, offset: mondayOffset };
    }

    function renderPreview() {
      const key = monthKey(visibleMonth);
      const month = calendarData.months[key] || {};
      const { count, offset } = monthDays(visibleMonth);
      previewMonth.textContent = monthLabel(visibleMonth).toUpperCase();
      previewDays.innerHTML = "";
      for (let i = 0; i < offset; i++) {
        const blank = document.createElement("span");
        previewDays.appendChild(blank);
      }
      for (let day = 1; day <= count; day++) {
        const cell = document.createElement("span");
        const amount = month.days && month.days[String(day)];
        cell.textContent = day;
        if (typeof amount === "number") cell.classList.add(amount >= 0 ? "positive" : "negative");
        if (key + "-" + String(day).padStart(2, "0") === todayKey) cell.classList.add("today");
        previewDays.appendChild(cell);
      }
    }

    function renderHistory() {
      const visibleMonthKey = monthKey(visibleMonth);
      const transactions = (Array.isArray(calendarData.history) ? calendarData.history : [])
        .filter(item => typeof item.date === "string" && item.date.slice(0, 7) === visibleMonthKey)
        .slice();
      const deposits = transactions.filter(item => item.type === "deposit").reduce((sum, item) => sum + Math.max(0, Number(item.amount) || 0), 0);
      const withdrawals = transactions.filter(item => item.type === "withdrawal").reduce((sum, item) => sum + Math.abs(Math.min(0, Number(item.amount) || 0)), 0);
      historyDeposits.textContent = money(deposits);
      historyWithdrawals.textContent = money(-withdrawals);
      historyList.innerHTML = "";
      transactions.sort((a, b) => {
        const dateOrder = b.date.localeCompare(a.date);
        if (dateOrder !== 0) return dateOrder;
        return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0);
      }).forEach(item => {
        const isDeposit = item.type === "deposit";
        const row = document.createElement("button");
        row.type = "button";
        row.className = "history-row";
        row.setAttribute("aria-pressed", "false");
        row.setAttribute("aria-label", (isDeposit ? "Пополнение " : "Вывод ") + money(Math.abs(Number(item.amount) || 0)) + ", " + item.date + ". Удерживай, чтобы удалить");
        let historyHoldTimer = null;
        let historyHoldHandled = false;
        row.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          historyHoldHandled = false;
          historyHoldTimer = window.setTimeout(() => {
            historyHoldHandled = true;
            deleteHistoryTransaction(item);
          }, 650);
        });
        ["pointerup", "pointercancel", "pointerleave"].forEach(name => row.addEventListener(name, () => {
          if (historyHoldTimer !== null) window.clearTimeout(historyHoldTimer);
          historyHoldTimer = null;
        }));
        row.addEventListener("contextmenu", event => {
          event.preventDefault();
          historyHoldHandled = true;
          deleteHistoryTransaction(item);
        });
        row.addEventListener("click", event => {
          if (historyHoldHandled) {
            event.preventDefault();
            event.stopPropagation();
            historyHoldHandled = false;
            return;
          }
          const wasSelected = row.getAttribute("aria-pressed") === "true";
          historyList.querySelectorAll(".history-row").forEach(button => button.setAttribute("aria-pressed", "false"));
          row.setAttribute("aria-pressed", String(!wasSelected));
        });
        const icon = document.createElement("span");
        icon.className = "history-kind-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = isDeposit ? "+" : "−";
        const date = document.createElement("time");
        date.className = "history-date";
        date.dateTime = item.date;
        date.textContent = new Date(item.date + "T12:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
        const type = document.createElement("span");
        type.className = "history-type " + (isDeposit ? "deposit" : "withdrawal");
        type.textContent = isDeposit ? "Пополнение" : "Вывод";
        const amount = document.createElement("strong");
        amount.className = "history-amount " + (isDeposit ? "deposit" : "withdrawal");
        amount.textContent = money(isDeposit ? Math.abs(Number(item.amount) || 0) : -Math.abs(Number(item.amount) || 0));
        row.append(icon, date, type, amount);
        historyList.appendChild(row);
      });
      if (!transactions.length) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "Операций пока нет";
        historyList.appendChild(empty);
      }
    }

    function parseDateKey(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day));
    }
    function dateKeyFromDate(date) {
      return date.getUTCFullYear() + "-" + String(date.getUTCMonth() + 1).padStart(2, "0") + "-" + String(date.getUTCDate()).padStart(2, "0");
    }
    function formatEditorDate(dateKey) {
      return parseDateKey(dateKey).toLocaleDateString("ru-RU", { day:"numeric", month:"short", timeZone:"UTC" });
    }
    function dateKeysBetween(start, end) {
      const first = parseDateKey(start);
      const last = parseDateKey(end);
      const low = first <= last ? first : last;
      const high = first <= last ? last : first;
      const keys = [];
      for (let date = new Date(low); date <= high; date.setUTCDate(date.getUTCDate() + 1)) keys.push(dateKeyFromDate(date));
      return keys;
    }
    function updateEditorRange() {
      const ordered = [rangeStart, rangeEnd].sort();
      editorStartDate.textContent = formatEditorDate(ordered[0]);
      editorEndDate.textContent = formatEditorDate(ordered[1]);
      editorHint.textContent = selectingRangeEnd ? "Теперь выбери конечную дату — можно нажать или провести по календарю" : "Удерживай дату, чтобы начать новый диапазон";
      editorKindActions.hidden = rangeStart !== rangeEnd || rangeStart > todayKey;
    }
    function openCalendarEditor(dateKey) {
      editorActive = true;
      rangeStart = dateKey;
      rangeEnd = dateKey;
      selectingRangeEnd = true;
      selectedDate = dateKey;
      const month = calendarData.months[dateKey.slice(0,7)] || {};
      const existing = month.days && month.days[String(Number(dateKey.slice(-2)))];
      editorAmount.value = typeof existing === "number" ? existing.toFixed(2) : "";
      calendarEditor.hidden = false;
      calendarDays.dataset.rangeSelecting = "true";
      updateEditorRange();
      renderCalendar();
    }
    function closeCalendarEditor() {
      editorActive = false;
      selectingRangeEnd = false;
      rangeStart = null;
      rangeEnd = null;
      calendarEditor.hidden = true;
      delete calendarDays.dataset.rangeSelecting;
      renderCalendar();
    }
    function updateRangeEnd(dateKey) {
      if (!editorActive || !selectingRangeEnd || dateKey.slice(0,7) !== rangeStart.slice(0,7)) return;
      rangeEnd = dateKey;
      selectedDate = dateKey;
      const selectedValues = dateKeysBetween(rangeStart, rangeEnd).map(key => {
        const itemMonth = calendarData.months[key.slice(0,7)] || {};
        return itemMonth.days && itemMonth.days[String(Number(key.slice(-2)))];
      });
      const firstValue = selectedValues[0];
      editorAmount.value = selectedValues.every(item => typeof item === "number" && item === firstValue) ? Number(firstValue).toFixed(2) : "";
      updateEditorRange();
      const low = rangeStart < rangeEnd ? rangeStart : rangeEnd;
      const high = rangeStart < rangeEnd ? rangeEnd : rangeStart;
      calendarDays.querySelectorAll(".calendar-day[data-date]").forEach(button => {
        const key = button.dataset.date;
        button.classList.toggle("range-start", key === low);
        button.classList.toggle("range-end", key === high && high !== low);
        button.classList.toggle("in-range", key > low && key < high);
        button.classList.toggle("selected", key === dateKey);
      });
    }
    function saveCalendarDataLocally() {
      try {
        localStorage.setItem(calendarStorageKey, JSON.stringify(calendarData));
        return true;
      } catch (error) {
        console.error("Could not save calendar changes locally", error);
        return false;
      }
    }
    function applyCalendarEdit() {
      const amount = Number(editorAmount.value);
      if (editorAmount.value.trim() === "" || !Number.isFinite(amount)) {
        editorAmount.setCustomValidity("Введи корректную сумму");
        editorAmount.reportValidity();
        return;
      }
      editorAmount.setCustomValidity("");
      const start = rangeStart < rangeEnd ? rangeStart : rangeEnd;
      const end = rangeStart < rangeEnd ? rangeEnd : rangeStart;
      dateKeysBetween(start, end).forEach(dateKey => {
        const key = dateKey.slice(0,7);
        if (!calendarData.months[key]) calendarData.months[key] = { label: monthLabel(parseDateKey(dateKey)), days:{} };
        if (!calendarData.months[key].days) calendarData.months[key].days = {};
        calendarData.months[key].days[String(Number(dateKey.slice(-2)))] = Math.round(amount * 100) / 100;
      });
      saveCalendarDataLocally();
      closeCalendarEditor();
      renderPreview();
      renderCalendar();
      const daysCount = dateKeysBetween(start, end).length;
      calendarDetail.textContent = "Сумма " + money(amount) + " сохранена для " + (daysCount === 1 ? formatEditorDate(start) : daysCount + " дней");
    }

    function renderCalendar() {
      updateGoalProgress(visibleMonth);
      const key = monthKey(visibleMonth);
      const month = calendarData.months[key] || {};
      const { count, offset } = monthDays(visibleMonth);
      calendarTitle.textContent = monthLabel(visibleMonth);
      calendarDays.innerHTML = "";
      for (let i = 0; i < offset; i++) {
        const blank = document.createElement("div");
        blank.className = "calendar-day empty";
        blank.setAttribute("aria-hidden", "true");
        calendarDays.appendChild(blank);
      }
      for (let day = 1; day <= count; day++) {
        const value = month.days && month.days[String(day)];
        const dateKey = key + "-" + String(day).padStart(2, "0");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day";
        if (selectedDate === dateKey) button.classList.add("selected");
        if (editorActive && rangeStart && rangeEnd) {
          const low = rangeStart < rangeEnd ? rangeStart : rangeEnd;
          const high = rangeStart < rangeEnd ? rangeEnd : rangeStart;
          if (dateKey === low) button.classList.add("range-start");
          else if (dateKey === high) button.classList.add("range-end");
          else if (dateKey > low && dateKey < high) button.classList.add("in-range");
        }
        if (dateKey === todayKey) {
          button.classList.add("today");
          button.setAttribute("aria-current", "date");
        }
        button.setAttribute("aria-label", monthLabel(visibleMonth) + " " + day + (typeof value === "number" ? ", " + money(value) : ", no amount recorded"));
        const number = document.createElement("span");
        number.className = "calendar-day-number";
        number.textContent = day;
        const amount = document.createElement("span");
        amount.className = "calendar-amount";
        if (typeof value === "number") {
          amount.textContent = money(value);
          amount.classList.add(value >= 0 ? "positive" : "negative");
        } else {
          amount.textContent = "—";
          amount.classList.add("no-value");
        }
        button.append(number, amount);
        button.dataset.date = dateKey;
        button.addEventListener("click", () => {
          if (editorActive) {
            if (!selectingRangeEnd) {
              rangeStart = dateKey;
              rangeEnd = dateKey;
              selectingRangeEnd = true;
              calendarDays.dataset.rangeSelecting = "true";
              editorHint.textContent = "Выбери вторую дату диапазона";
              updateRangeEnd(dateKey);
              return;
            }
            if (dateKey < rangeStart) {
              rangeStart = dateKey;
              rangeEnd = dateKey;
              selectedDate = dateKey;
              editorAmount.value = "";
              updateEditorRange();
              renderCalendar();
              return;
            }
            if (dateKey === rangeStart) return;
            updateRangeEnd(dateKey);
            selectingRangeEnd = false;
            delete calendarDays.dataset.rangeSelecting;
            editorHint.textContent = "Диапазон выбран. Введи сумму — она применится ко всем дням";
            updateEditorRange();
            return;
          }
          selectedDate = dateKey;
          renderCalendar();
          const signClass = typeof value === "number" ? (value >= 0 ? "positive" : "negative") : "";
          calendarDetail.innerHTML = "<strong>" + day + " " + monthLabel(visibleMonth) + "</strong>" +
            (typeof value === "number" ? " · <span class='" + signClass + "'>" + money(value) + "</span>" : " · Нет сохранённой суммы");
        });
        calendarDays.appendChild(button);
      }
    }

    function changeMonth(delta) {
      visibleMonth = new Date(Date.UTC(visibleMonth.getUTCFullYear(), visibleMonth.getUTCMonth() + delta, 1));
      selectedDate = null;
      if (editorActive) closeCalendarEditor();
      calendarDetail.textContent = "Выбери день, чтобы посмотреть сумму";
      renderCalendar();
      renderHistory();
    }

    async function loadCalendarData() {
      try {
        const savedDeposit = localStorage.getItem(depositStorageKey);
        if (savedDeposit !== null && Number.isFinite(Number(savedDeposit))) depositAmount = Number(savedDeposit);
      } catch (storageError) {
        console.warn("Could not restore deposit amount", storageError);
      }
      renderDepositAmount();
      try {
        const response = await fetch("./data/calendar.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Calendar data request failed");
        calendarData = await response.json();
        try {
          const saved = localStorage.getItem(calendarStorageKey);
          if (saved) calendarData = JSON.parse(saved);
        } catch (storageError) {
          console.warn("Could not restore local calendar edits", storageError);
        }
      } catch (error) {
        console.error("Could not load calendar data", error);
      }
      restoreDepositHistory();
      renderPreview();
      renderCalendar();
      renderHistory();
    }

    function openSheet(tile, showCalendar) {
      activeTile = tile;
      genericSheet.dataset.visible = String(!showCalendar);
      calendarFull.dataset.visible = String(showCalendar);
      historyPanel.dataset.visible = String(showCalendar);
      sheet.style.transform = "";
      sheet.dataset.open = "true";
      sheet.setAttribute("aria-hidden", "false");
      backdrop.dataset.open = "true";
      document.body.classList.add("sheet-open");
      if (showCalendar) {
        visibleMonth = new Date(Date.UTC(today.getFullYear(), today.getMonth(), 1));
        selectedDate = todayKey;
        calendarDetail.textContent = "Сегодня · " + today.toLocaleDateString("ru-RU");
        renderCalendar();
        renderHistory();
      }
    }

    function closeSheet() {
      if (dragPointerId !== null) return;
      sheet.dataset.open = "false";
      sheet.setAttribute("aria-hidden", "true");
      backdrop.dataset.open = "false";
      document.body.classList.remove("sheet-open");
      sheet.style.transform = "";
      const tileToFocus = activeTile;
      activeTile = null;
      if (tileToFocus) tileToFocus.focus({ preventScroll: true });
    }

    tiles.forEach(tile => tile.addEventListener("click", () => openSheet(tile, tile === calendarLaunch)));
    document.getElementById("month-prev").addEventListener("click", () => changeMonth(-1));
    document.getElementById("month-next").addEventListener("click", () => changeMonth(1));
    document.getElementById("editor-close").addEventListener("click", closeCalendarEditor);
    document.getElementById("editor-cancel").addEventListener("click", closeCalendarEditor);
    document.getElementById("editor-apply").addEventListener("click", applyCalendarEdit);
    editorAmount.addEventListener("input", () => editorAmount.setCustomValidity(""));
    let depositDialogKind = "deposit";
    function openDepositDialog(kind) {
      if (rangeStart !== rangeEnd || !rangeStart || rangeStart > todayKey) return;
      depositDialogKind = kind;
      const isDeposit = kind === "deposit";
      depositDialogTitle.textContent = isDeposit ? "Пополнение депозита" : "Вывод из депозита";
      depositDialogSubmit.textContent = isDeposit ? "Пополнить" : "Вывести";
      depositDialogAmount.value = "";
      depositDialogAmount.setCustomValidity("");
      depositDialogBackdrop.hidden = false;
      requestAnimationFrame(() => {
        syncDepositDialogViewport();
        depositDialogAmount.focus();
        requestAnimationFrame(syncDepositDialogViewport);
      });
    }
    function closeDepositDialog() {
      depositDialogBackdrop.hidden = true;
      depositDialogAmount.value = "";
    }
    function submitDepositDialog() {
      const amount = Number(depositDialogAmount.value);
      if (depositDialogAmount.value.trim() === "" || !Number.isFinite(amount) || amount <= 0) {
        depositDialogAmount.setCustomValidity("Введи сумму больше нуля");
        depositDialogAmount.reportValidity();
        return;
      }
      depositDialogAmount.setCustomValidity("");
      if (depositDialogKind === "withdrawal" && amount > depositAmount) {
        depositDialogAmount.setCustomValidity("Сумма вывода превышает депозит");
        depositDialogAmount.reportValidity();
        return;
      }
      depositAmount = Math.round((depositAmount + (depositDialogKind === "deposit" ? amount : -amount)) * 100) / 100;
      saveDepositAmount();
      if (!Array.isArray(calendarData.history)) calendarData.history = [];
      calendarData.history.push({
        id: "deposit-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
        date: todayKey,
        createdAt: Date.now(),
        type: depositDialogKind,
        amount: depositDialogKind === "deposit" ? amount : -amount,
        source: "deposit-dialog"
      });
      saveDepositHistory();
      renderHistory();
      calendarDetail.textContent = depositDialogKind === "deposit" ? "Депозит пополнен на " + money(amount) : "Из депозита выведено " + money(amount);
      closeDepositDialog();
      closeCalendarEditor();
    }
    editorDeposit.addEventListener("click", () => openDepositDialog("deposit"));
    editorWithdrawal.addEventListener("click", () => openDepositDialog("withdrawal"));
    depositDialogSubmit.addEventListener("click", submitDepositDialog);
    document.getElementById("deposit-dialog-close").addEventListener("click", closeDepositDialog);
    document.getElementById("deposit-dialog-cancel").addEventListener("click", closeDepositDialog);
    depositDialogBackdrop.addEventListener("click", event => {
      if (event.target === depositDialogBackdrop) closeDepositDialog();
    });
    depositDialogAmount.addEventListener("input", () => depositDialogAmount.setCustomValidity(""));
    depositDialogAmount.addEventListener("keydown", event => {
      if (event.key === "Enter") submitDepositDialog();
      if (event.key === "Escape") closeDepositDialog();
    });
    calendarDays.addEventListener("contextmenu", event => event.preventDefault());
    calendarDays.addEventListener("selectstart", event => event.preventDefault());
    calendarDays.addEventListener("pointerdown", event => {
      const dayButton = event.target.closest(".calendar-day[data-date]");
      if (!dayButton || event.button !== 0 || editorActive) return;
      holdPointerId = event.pointerId;
      holdStarted = false;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      const dateKey = dayButton.dataset.date;
      holdTimer = window.setTimeout(() => {
        holdStarted = true;
        openCalendarEditor(dateKey);
      }, 480);
    });
    calendarDays.addEventListener("pointermove", event => {
      if (rangePointerId === event.pointerId) {
        const underPointer = document.elementFromPoint(event.clientX,event.clientY);
        const dayButton = underPointer && underPointer.closest(".calendar-day[data-date]");
        if (dayButton && dayButton.dataset.date !== rangeEnd) {
          rangePointerMoved = true;
          updateRangeEnd(dayButton.dataset.date);
        }
        return;
      }
      if (holdPointerId !== event.pointerId) return;
      if (!holdStarted && Math.hypot(event.clientX-lastPointerX,event.clientY-lastPointerY) > 12) {
        window.clearTimeout(holdTimer);
        holdTimer = null;
      }
    });
    function finishCalendarPointer(event) {
      if (rangePointerId === event.pointerId) {
        rangePointerId = null;
        rangePointerMoved = false;
        return;
      }
      if (holdPointerId !== event.pointerId) return;
      if (holdTimer) window.clearTimeout(holdTimer);
      holdTimer = null;
      holdPointerId = null;
    }
    calendarDays.addEventListener("pointerup", finishCalendarPointer);
    calendarDays.addEventListener("pointercancel", finishCalendarPointer);
    backdrop.addEventListener("click", closeSheet);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !depositDialogBackdrop.hidden) { closeDepositDialog(); return; }
      if (event.key === "Escape" && sheet.dataset.open === "true") closeSheet();
    });

    handle.addEventListener("pointerdown", event => {
      if (dragPointerId !== null || event.button !== 0) return;
      dragPointerId = event.pointerId;
      dragStartY = event.clientY;
      dragStartTime = performance.now();
      dragDistance = 0;
      sheet.style.transition = "none";
      handle.setPointerCapture(event.pointerId);
    });
    handle.addEventListener("pointermove", event => {
      if (event.pointerId !== dragPointerId) return;
      const rawDistance = event.clientY - dragStartY;
      dragDistance = rawDistance < 0 ? rawDistance * 0.18 : rawDistance;
      sheet.style.transform = "translateY(" + Math.max(-24, dragDistance) + "px)";
    });
    function finishDrag(event) {
      if (event.pointerId !== dragPointerId) return;
      const elapsed = Math.max(1, performance.now() - dragStartTime);
      const velocity = Math.max(0, dragDistance) / elapsed;
      const threshold = Math.max(110, sheet.getBoundingClientRect().height * 0.22);
      const shouldDismiss = dragDistance > threshold || velocity > 0.11;
      dragPointerId = null;
      sheet.style.transition = "";
      if (shouldDismiss) closeSheet();
      else sheet.style.transform = "";
    }
    handle.addEventListener("pointerup", finishDrag);
    handle.addEventListener("pointercancel", finishDrag);
    handle.addEventListener("lostpointercapture", event => {
      if (event.pointerId === dragPointerId) finishDrag(event);
    });

    loadCalendarData();
  </script>
</body>
</html>
